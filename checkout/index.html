<style id="rh-cx-css">
/* ===== Compact buy-form redesign (checkout) ===== */
.rh-cx-shell{max-width:none;width:100%;margin:0;padding:8px 6px 88px;box-sizing:border-box}
.rh-cx-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.rh-cx-brand{display:flex;align-items:center;gap:9px;text-decoration:none}
.rh-cx-mark{width:30px;height:30px;border-radius:9px;background:#fff;color:#0a0a0a;display:grid;place-items:center;font-weight:800;font-size:13px}
.rh-cx-brandname{font-weight:800;letter-spacing:.12em;font-size:.74rem;color:#f5f5f3;line-height:1.2}
.rh-cx-brandsub{font-size:.62rem;color:#6f6f6c}
.rh-cx-topright{display:flex;align-items:center;gap:8px}
.rh-cx-sec{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;color:#3ddc84;border:1px solid rgba(61,220,132,.25);border-radius:999px;padding:6px 11px;background:rgba(61,220,132,.05);white-space:nowrap}
.rh-cx-sec svg{width:13px;height:13px;flex:none}
.rh-cx-close{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.1);display:grid;place-items:center;color:#a9a9a6;text-decoration:none;transition:.15s}
.rh-cx-close:hover{color:#fff;border-color:rgba(255,255,255,.2)}
.rh-cx-card{background:transparent;border:0;border-radius:0;overflow:visible}
.rh-cx-photo{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#1a1a1a}
.rh-cx-body{padding:10px 0 12px}
.rh-cx-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.rh-cx-title{font-size:1.15rem;font-weight:800;margin:0;color:#f5f5f3;letter-spacing:-.01em;line-height:1.25}
.rh-cx-sub{font-size:.8rem;color:#a9a9a6;margin-top:2px}
.rh-cx-titlerow{display:flex;align-items:center;gap:6px;margin-top:3px}
.rh-cx-info{width:26px;height:26px;border-radius:999px;border:none;background:transparent;color:#a9a9a6;display:grid;place-items:center;cursor:pointer;transition:transform .18s,color .15s}
.rh-cx-info:hover{color:#f5f5f3}
.rh-cx-info.open{transform:rotate(180deg);color:#f5f5f3}
.rh-cx-info svg{width:19px;height:19px}
.rh-cx-price{flex:none;text-align:right}
.rh-cx-usd{font-size:1.1rem;font-weight:800;color:#f5f5f3}
.rh-cx-bdt{font-size:.72rem;color:#a9a9a6}
.rh-cx-infopanel{max-height:0;overflow:hidden;transition:max-height .22s ease}
.rh-cx-infopanel.open{max-height:360px;overflow-y:auto}
.rh-cx-infotext{font-size:.78rem;color:#a9a9a6;line-height:1.6;padding-top:8px}
.rh-cx-infotext b{color:#f5f5f3;font-weight:700}
.rh-cx-hr{border:none;border-top:1px solid rgba(255,255,255,.1);margin:11px 0}

/* ===== compact form overrides ===== */
.rh-cx-body #serviceOrderForm{display:block}
.rh-cx-body .form-group{margin-bottom:11px}
.rh-cx-body .form-label{display:block;font-size:.78rem;font-weight:700;color:#a9a9a6;margin-bottom:6px}
.rh-cx-body .form-input,.rh-cx-body .form-select,.rh-cx-body .form-textarea{font-size:.88rem;padding:9px 11px;border-radius:10px;background:#0a0a0a!important;border:1px solid rgba(255,255,255,.1)!important;color:#f5f5f3!important;width:100%}
.rh-cx-body .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.rh-cx-body .form-row{grid-template-columns:1fr}}
.rh-cx-body .radio-group{display:grid;gap:8px}
.rh-cx-body .radio-option{display:flex;align-items:center;gap:9px;font-size:.86rem;font-weight:700;color:#ddd;padding:11px 12px;border:1px solid rgba(255,255,255,.12);border-radius:11px;background:#141414;cursor:pointer}
.rh-cx-body .radio-option:has(input:checked){border-color:#fff;background:#fff;color:#080808}
.rh-cx-body .radio-option input{accent-color:#fff}
.rh-cx-body .form-note{font-size:.72rem!important;color:#6f6f6c!important;line-height:1.6;margin-top:-2px}
.rh-cx-body .service-notice{margin:8px 0 12px;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#c9c9c6;font-weight:700;line-height:1.5;font-size:.8rem}
.rh-cx-body .ff-option-list{display:grid!important;gap:7px}
.rh-cx-body .ff-option-item{padding:10px 12px;border-radius:11px}
.rh-cx-body .ff-option-label{font-size:.84rem}
.rh-cx-body .ff-option-price{font-size:.82rem}
.rh-cx-body .ff-type-btn{font-size:.8rem;padding:9px 8px;border-radius:11px}
.rh-cx-body .plan-picker{margin-top:8px;border-radius:11px}
.rh-cx-body .plan-picker-summary{padding:11px 13px;min-height:44px}

/* ===== compact payment panel (injected by service-modal.js) ===== */
.rh-cx-body #serviceCheckoutPanel .service-checkout-box{margin:14px 0 0;padding:14px;border-radius:14px;background:#141414!important;border:1px solid rgba(255,255,255,.12)!important}
.rh-cx-body #serviceCheckoutPanel .service-checkout-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rh-cx-body #serviceCheckoutPanel .service-checkout-head strong{font-size:.9rem}
.rh-cx-body #serviceCheckoutPanel .service-price-pill{min-width:0;padding:7px 11px;border-radius:11px;text-align:right}
.rh-cx-body #serviceCheckoutPanel .service-price-pill span{font-size:1rem}
.rh-cx-body #serviceCheckoutPanel .service-price-pill small{font-size:.72rem}
.rh-cx-body #serviceCheckoutPanel .service-pay-note{font-size:.72rem;margin-top:9px}
.rh-cx-body #serviceCheckoutPanel .coupon-row{margin-bottom:10px}
.rh-cx-body #serviceCheckoutPanel .coupon-input-wrap{border-radius:11px;padding:7px 10px}
.rh-cx-body #serviceCheckoutPanel #couponInput{font-size:.84rem}

/* ===== sticky mobile pay bar ===== */
.rh-cx-sticky{position:fixed;left:0;right:0;bottom:0;z-index:2400;background:rgba(10,10,10,.95);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.2);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.rh-cx-sticky-in{display:flex;align-items:center;gap:12px;max-width:none;width:100%;margin:0}
.rh-cx-stotal{flex:none}
.rh-cx-sl{font-size:.64rem;color:#6f6f6c;font-weight:700}
.rh-cx-sv{font-size:1.05rem;font-weight:800;color:#f5f5f3}
.rh-cx-spay{flex:1;padding:13px;border:none;border-radius:12px;background:#fff;color:#0a0a0a;font-weight:800;font-size:.9rem;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.rh-cx-spay svg{width:15px;height:15px}
.rh-cx-cart{flex:none;width:46px;height:46px;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:#141414;color:#f5f5f3;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s,background .15s}
.rh-cx-cart:hover{border-color:rgba(255,255,255,.4);background:#181818}
.rh-cx-cart svg{width:20px;height:20px}
@media(min-width:600px){.rh-cx-sticky .rh-cx-sticky-in{max-width:none}}

.checkout-page .checkout-state{max-width:none;width:100%;margin:8px 0}

/* ===== schema-driven fields (Claude dropdown/toggle) ===== */
.rh-cx-body .req{color:#ff5c5c}
.rh-cx-body .hint{font-size:.68rem;color:#6f6f6c;font-weight:600;margin-left:auto}
.rh-cx-body .pkg-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:1px solid rgba(255,255,255,.1);background:#0a0a0a;border-radius:10px;padding:10px 12px;cursor:pointer;font-family:inherit;text-align:left;color:#f5f5f3}
.rh-cx-body .pkg-toggle:hover{border-color:rgba(255,255,255,.25)}
.rh-cx-body .pkg-toggle.open{border-color:#fff;border-bottom-left-radius:0;border-bottom-right-radius:0}
.rh-cx-body .pkg-toggle .pt-label{font-size:.86rem;font-weight:700;color:#f5f5f3;min-width:0}
.rh-cx-body .pkg-toggle .pt-label small{display:block;font-size:.68rem;color:#a9a9a6;font-weight:600;margin-top:1px}
.rh-cx-body .pkg-toggle .pt-right{display:flex;align-items:center;gap:8px;flex:none}
.rh-cx-body .pkg-toggle .pt-price{font-size:.9rem;font-weight:800;color:#f5f5f3}
.rh-cx-body .pkg-toggle .chev{width:16px;height:16px;flex:none;color:#a9a9a6;transition:transform .18s}
.rh-cx-body .pkg-toggle.open .chev{transform:rotate(180deg);color:#f5f5f3}
.rh-cx-body .opts{display:flex;flex-direction:column;gap:6px;border:1px solid #fff;border-top:none;border-radius:0 0 10px 10px;padding:8px;background:#0a0a0a}
.rh-cx-body .opt{display:flex;align-items:center;gap:10px;width:100%;border:1px solid rgba(255,255,255,.1);background:#141414;border-radius:10px;padding:9px 11px;cursor:pointer;font-family:inherit;text-align:left;color:#f5f5f3}
.rh-cx-body .opt:hover{border-color:rgba(255,255,255,.25)}
.rh-cx-body .opt.sel{border-color:#fff}
.rh-cx-body .opt .radio{width:17px;height:17px;flex:none;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);display:grid;place-items:center}
.rh-cx-body .opt.sel .radio{border-color:#fff}
.rh-cx-body .opt.sel .radio::after{content:"";width:9px;height:9px;border-radius:50%;background:#fff}
.rh-cx-body .opt .lbl{font-size:.86rem;font-weight:700;color:#f5f5f3;min-width:0}
.rh-cx-body .opt .lbl small{display:block;font-size:.7rem;color:#a9a9a6;font-weight:600}
.rh-cx-body .opt .tag,.rh-cx-body .pt-label .tag{font-size:.62rem;font-weight:800;color:#0a0a0a;background:#ffb454;border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.rh-cx-body .opt .p{margin-left:auto;font-size:.9rem;font-weight:800;color:#f5f5f3}
.rh-cx-body .tgl{display:flex;background:#0a0a0a;border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:3px;gap:3px}
.rh-cx-body .tgl button{flex:1;border:none;background:transparent;color:#6f6f6c;font-weight:700;font-size:.8rem;font-family:inherit;padding:9px;border-radius:8px;cursor:pointer}
.rh-cx-body .tgl button.active{background:#fff;color:#0a0a0a}

/* ===== embedded mode (cart plan picker iframe) ===== */
body.cx-embed .rh-cx-top{display:none!important}
body.cx-embed .rh-cx-shell{padding-top:6px!important}
body.cx-embed .rh-cx-sticky #stickyPayBtn{display:none!important}
body.cx-embed .rh-cx-sticky .rh-cx-sticky-in{justify-content:stretch}
body.cx-embed .rh-cx-sticky #addToCartBtn{flex:1;width:auto;height:48px;border:none;background:#111;color:#fff;font-weight:800;font-size:.9rem;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px}
body.cx-embed .rh-cx-sticky #addToCartBtn:hover{background:#222}
[data-theme="light"] body.cx-embed .rh-cx-sticky #addToCartBtn{background:#111!important;color:#fff!important}

/* Light checkout — kill leftover near-white text from dark-first CSS */
html[data-theme="light"] .rh-cx-body .pkg-toggle,
html[data-theme="light"] .rh-cx-body .opts,

}

html[data-theme="light"] .rh-cx-body .opts{border-color:#111!important}

html[data-theme="light"] .rh-cx-body .pkg-toggle .pt-price,
html[data-theme="light"] .rh-cx-body .opt .lbl,
html[data-theme="light"] .rh-cx-body .opt .p{

}

html[data-theme="light"] .rh-cx-body .opt.sel .p{color:#111!important}

html[data-theme="light"] .rh-cx-body .opt.sel .radio{border-color:#111!important}
html[data-theme="light"] .rh-cx-body .opt.sel .radio::after{background:#111!important}
html[data-theme="light"] #servicePriceBdt,
html[data-theme="light"] .service-price-pill small,
html[data-theme="light"] .rh-cx-body #serviceCheckoutPanel .service-price-pill small{
  color:#111111!important;opacity:1!important
}
html[data-theme="light"] .rh-cx-body #serviceCheckoutPanel .service-checkout-box{
  background:#fff!important;border:1px solid rgba(0,0,0,.12)!important
}
html[data-theme="light"] #buyWithCreditBtn,
html[data-theme="light"] #instantPayBtn,
html[data-theme="light"] .cx-pay,
html[data-theme="light"] .cart-pay{

html[data-theme="light"] #instantPayBtn .cx-pay-name,
html[data-theme="light"] .cx-pay .cx-pay-name,

html[data-theme="light"] .cx-pay .cx-pay-desc,
html[data-theme="light"] .cart-pay .p-desc{color:#4a4a48!important}
html[data-theme="light"] #buyWithCreditBtn.sel,
html[data-theme="light"] #instantPayBtn.sel,
html[data-theme="light"] .cx-pay.sel,
html[data-theme="light"] .cart-pay.sel{
  background:#fff!important;color:#111!important;border:2.5px solid #111!important
}
html[data-theme="light"] #buyWithCreditBtn.sel .cx-pay-name,
html[data-theme="light"] #instantPayBtn.sel .cx-pay-name,
html[data-theme="light"] .cx-pay.sel .cx-pay-name,
html[data-theme="light"] .cx-pay.sel .cx-pay-desc,
html[data-theme="light"] .cart-pay.sel .p-name,

html[data-theme="light"] .cx-pay.sel::after,

  background-size:10px!important;background-repeat:no-repeat!important;background-position:center!important
