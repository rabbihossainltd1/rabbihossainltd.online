  <title>Settings — RabbiHossainLTD</title>
  <meta name="description" content="Manage your RabbiHossainLTD profile, language and password." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://rabbihossainltd.online/settings/" />

  <style>
    .settings-page{min-height:100vh;padding:calc(var(--nav-h) + 2px) 8px 96px;background:var(--bg)}
    .settings-page-inner{max-width:none;width:100%;margin:0}
    .settings-page-head{margin-bottom:8px}
    .settings-page-head .kicker{display:none}
    .settings-page-head h1{font-size:clamp(1.35rem,4vw,1.85rem);margin:2px 0 0}
    .settings-page-head p{color:var(--text-secondary);font-size:.9rem}
    .settings-card{background:transparent;border:0;border-radius:0;padding:0}
    .settings-divider{height:1px;background:var(--border);margin:22px 0}
    .settings-block-title{font-size:.78rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#7a7a75;margin:0 0 14px}
    .settings-field{display:flex;flex-direction:column}
    .settings-field label{display:block;color:#b0b0ad;font-weight:900;font-size:.78rem;margin-bottom:6px}
    .settings-field input{width:100%;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.22);border-radius:13px;padding:11px 12px;color:#f8f8f7;outline:none;font-family:inherit;font-size:.9rem}
    .settings-field input:focus{border-color:rgba(255,255,255,.48)}
    .settings-field input:disabled{opacity:.55}
    .settings-actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
    .settings-btn{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:#ffffff;color:#080808;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-size:.88rem}
    .settings-btn svg{width:16px;height:16px;flex:none}
    .settings-photo-btn svg{width:17px;height:17px;flex:none}
    .settings-btn:hover{opacity:.92}
    .settings-btn.secondary{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:#e4e4e0}
    .settings-btn.secondary:hover{background:rgba(255,255,255,.12)}
    .settings-btn:disabled{opacity:.6;cursor:not-allowed}
    .settings-message{display:none;margin-top:12px;padding:11px 13px;border-radius:12px;font-size:.82rem;line-height:1.5}
    .settings-message.success{display:block;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#e0e0df}
    .settings-message.error{display:block;background:rgba(255,80,80,.08);border:1px solid rgba(255,80,80,.24);color:#ffb2b2}
    .settings-gate{text-align:center;padding:40px 24px}
    .settings-gate .mark{width:52px;height:52px;margin:0 auto 18px;border-radius:50%;background:#fff;color:#080808;display:grid;place-items:center;font-weight:900;font-size:1.3rem}
    .settings-gate h2{font-size:1.4rem;margin-bottom:8px}
    .settings-gate p{color:var(--text-secondary);margin-bottom:20px}
    .settings-block-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
    .settings-block-head .settings-block-title{margin:0}
    .settings-edit-btn{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#f5f5f3;display:grid;place-items:center;cursor:pointer}
    .settings-edit-btn svg{width:18px;height:18px}
    .settings-edit-btn[aria-pressed="true"]{background:#111;color:#fff;border-color:#111}
    html[data-theme="light"] .settings-edit-btn{color:#161616;border-color:rgba(0,0,0,.16)}
    .settings-photo-btn{display:none!important}
    .settings-avatar-preview{cursor:pointer}
    .settings-field input[readonly]{opacity:.78;cursor:default}
    #settingsPwPanel,.settings-pw-panel{display:none!important}
    .settings-page.is-pw-open #settingsPwPanel,
    .settings-page.is-pw-open .settings-pw-panel{display:block!important}
    .settings-reset-link{display:inline-block;margin-top:10px;background:none;border:0;padding:0;color:#8a8a87;font:inherit;font-size:.84rem;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
    html[data-theme="light"] .settings-reset-link{color:#6f6f6c}
    @media(max-width:560px){.settings-card{padding:0}.settings-grid{grid-template-columns:1fr}}
  </style>
  <style id="rh-bottom-nav-css">
    .rabbi-bottom-nav{position:fixed;left:14px;right:14px;bottom:12px;z-index:2400;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:620px;margin:0 auto;padding:8px;border-radius:24px;background:rgba(5,10,16,.92);border:1px solid rgba(255, 255, 255,.18);box-shadow:0 18px 55px rgba(0,0,0,.55),0 0 24px rgba(255, 255, 255,.08);backdrop-filter:blur(18px);}
    .rabbi-bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:54px;border-radius:18px;color:#aaaaaa;text-decoration:none;font-size:.68rem;font-weight:800;letter-spacing:.01em;transition:.2s ease;}
    .rabbi-bottom-nav a svg{width:20px;height:20px;stroke-width:1.8;}
    .rabbi-bottom-nav a.active,.rabbi-bottom-nav a:hover{color:#080808;background:#ffffff;box-shadow:0 8px 24px rgba(255, 255, 255,.20);}
    body.has-bottom-nav{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))!important;}
    body.has-bottom-nav main,body.has-bottom-nav .wallet-page,body.has-bottom-nav .dashboard-page{padding-bottom:0!important;}
    @media(min-width:900px){.rabbi-bottom-nav{bottom:18px;left:50%;right:auto;transform:translateX(-50%);width:560px;}}
  
    .theme-swatch{width:22px;height:22px;border-radius:50%;flex:none}
    .settings-lang-btn.theme-btn{flex-direction:row;justify-content:flex-start;gap:10px}
    .settings-lang-btn.theme-btn.sel-theme{border-color:#111;background:rgba(0,0,0,.05)}
    [data-theme="dark"] .settings-lang-btn.theme-btn.sel-theme{border-color:#fff;background:rgba(255,255,255,.1)}
</style>
</head>

  <main class="settings-page">
    <div class="settings-page-inner">
      <div class="settings-page-head">
        <h1>Settings</h1>
      </div>

      <!-- Login gate -->
      <div class="settings-card settings-gate" id="settingsLoginGate" style="display:none;">
        <div class="mark">→</div>
        <h2>Login required</h2>
        <p>Login to view and edit settings.</p>
        <button class="settings-btn" id="settingsLoginBtn" type="button">Login</button>
      </div>

      <!-- Settings content -->
      <div class="settings-card" id="settingsContent" style="display:none;">
        <!-- Profile -->
        <div class="settings-block-head">
          <div class="settings-block-title">Profile</div>
          <button class="settings-edit-btn" id="settingsEditProfileBtn" type="button" aria-label="Edit profile" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
        </div>
        <div class="settings-avatar-row">
          <label class="settings-avatar-preview" id="settingsAvatarPreview" title="Change picture">U
            <input type="file" id="settingsPhotoInput" accept="image/*" hidden />
          </label>
        </div>

        <div class="settings-grid">
          <div class="settings-field">
            <label for="settingsName">Name</label>
            <input type="text" id="settingsName" placeholder="Your name" readonly />
          </div>
          <div class="settings-field">
            <label for="settingsEmail">Email</label>
            <input type="email" id="settingsEmail" disabled />
          </div>
        </div>

        <div class="settings-divider"></div>

        <!-- Password -->
        <div class="settings-block-title">Password</div>
        <div class="settings-actions">
          <button class="settings-btn" id="settingsChangePasswordBtn" type="button" aria-expanded="false" aria-controls="settingsPwPanel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span>Change Password</span>
          </button>
        </div>
        <button class="settings-reset-link" id="settingsResetPasswordBtn" type="button">Forgot password</button>
        <div class="settings-pw-panel" id="settingsPwPanel" hidden style="display:none">
          <div class="settings-grid">
            <div class="settings-field">
              <label for="settingsCurrentPassword">Current Password</label>
              <input type="password" id="settingsCurrentPassword" placeholder="Current password" autocomplete="current-password" />
            </div>
            <div class="settings-field">
              <label for="settingsNewPassword">New Password</label>
              <input type="password" id="settingsNewPassword" placeholder="New password" autocomplete="new-password" />
            </div>
            <div class="settings-field">
              <label for="settingsConfirmPassword">Confirm Password</label>
              <input type="password" id="settingsConfirmPassword" placeholder="Confirm new password" autocomplete="new-password" />
            </div>
          </div>
        </div>

        <div class="settings-divider"></div>

        <!-- Language -->
        <div class="settings-block-title">Language</div>
        <div class="settings-lang-row">
          <label class="settings-lang-btn" id="settingsLangEnLabel">
            <input type="radio" name="siteLanguage" id="langEn" value="en" />
            <span class="lang-flag"><svg width="20" height="14" viewBox="0 0 60 42"><rect width="60" height="42" fill="#012169"/><path d="M0 0L60 42M60 0L0 42" stroke="#fff" stroke-width="7"/><path d="M0 0L60 42M60 0L0 42" stroke="#C8102E" stroke-width="4.5"/><path d="M30 0V42M0 21H60" stroke="#fff" stroke-width="12"/><path d="M30 0V42M0 21H60" stroke="#C8102E" stroke-width="7"/></svg></span>
            <span class="lang-name">English</span>
          </label>
          <label class="settings-lang-btn" id="settingsLangBnLabel">
            <input type="radio" name="siteLanguage" id="langBn" value="bn" />
            <span class="lang-flag"><svg width="20" height="14" viewBox="0 0 60 42"><rect width="60" height="42" fill="#006a4e"/><circle cx="27" cy="21" r="12" fill="#f42a41"/></svg></span>
            <span class="lang-name">বাংলা</span>
          </label>
        </div>
        <button class="settings-lang-save-btn" id="saveLangBtn" type="button" style="display:none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2z"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
          Save Language
        </button>

        <div class="settings-divider"></div>

        <!-- Theme -->
        <div class="settings-block-title">Theme</div>
        <div class="settings-lang-row" id="themeRow">
          <button type="button" class="settings-lang-btn theme-btn" data-theme="light" id="themeLightBtn">
            <span class="theme-swatch" style="background:#fff;border:1px solid rgba(0,0,0,.15);"></span>
            <span class="lang-name">Light</span>
          </button>
          <button type="button" class="settings-lang-btn theme-btn" data-theme="dark" id="themeDarkBtn">
            <span class="theme-swatch" style="background:#0a0a0a;border:1px solid rgba(255,255,255,.2);"></span>
            <span class="lang-name">Dark</span>
          </button>
        </div>

        <div id="profileSettingsMessage" class="settings-message" style="display:none;"></div>
      </div>
    </div>
  </main>

  </nav>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() { navigator.serviceWorker.register('/sw.js').catch(function() {}); });
    }
    // Bootstrap the settings page once auth.js exposes the entry point.
    (function boot() {
      if (window.rabbiAuth && typeof window.rabbiAuth.initSettingsPage === 'function') {
        window.rabbiAuth.initSettingsPage();
      } else {
        setTimeout(boot, 120);
      }
    })();
  </script>
