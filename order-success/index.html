  <style id="rh-bottom-nav-css">
    .rabbi-bottom-nav{position:fixed;left:14px;right:14px;bottom:12px;z-index:2400;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:620px;margin:0 auto;padding:8px;border-radius:24px;background:rgba(5,10,16,.92);border:1px solid rgba(255, 255, 255,.18);box-shadow:0 18px 55px rgba(0,0,0,.55),0 0 24px rgba(255, 255, 255,.08);backdrop-filter:blur(18px);}
    .rabbi-bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:54px;border-radius:18px;color:#aaaaaa;text-decoration:none;font-size:.68rem;font-weight:800;letter-spacing:.01em;transition:.2s ease;}
    .rabbi-bottom-nav a svg{width:20px;height:20px;stroke-width:1.8;}
    .rabbi-bottom-nav a.active,.rabbi-bottom-nav a:hover{color:#080808;background:#ffffff;box-shadow:0 8px 24px rgba(255, 255, 255,.20);}
    body.has-bottom-nav{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))!important;}
    @media(min-width:900px){.rabbi-bottom-nav{bottom:18px;left:50%;right:auto;transform:translateX(-50%);width:560px;}}
  </style>
  <style>
    .os-wrap{max-width:440px;margin:0 auto;padding:calc(var(--nav-h,64px) + 28px) 16px 40px;box-sizing:border-box}
    .os-card{text-align:center;padding:8px 4px 4px}
    .os-ring{width:88px;height:88px;border-radius:50%;margin:0 auto 20px;position:relative;display:flex;align-items:center;justify-content:center;background:#161616;border:2px solid rgba(255,255,255,.34)}
    .os-ring:before{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid rgba(255,255,255,.16);animation:osRing 1.6s ease-out infinite}
    .os-ring svg{width:40px;height:40px;stroke:#f5f5f3;stroke-dasharray:50;stroke-dashoffset:50;animation:osCheck .55s ease .12s forwards}
    .os-badge{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;background:#161616;border:1px solid rgba(255,255,255,.34);color:#f5f5f3;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
    .os-badge i{width:7px;height:7px;border-radius:50%;background:#3ddc84;display:inline-block}
    .os-card h1{font-size:1.55rem;line-height:1.2;margin:0 0 8px;color:#f5f5f3;font-weight:800}
    .os-card p.lead{color:#a9a9a6;font-size:.92rem;line-height:1.65;margin:0 0 6px}
    .os-card p.note{color:#8f8f8a;font-size:.82rem;margin:0 0 18px}
    .os-card p.note strong{color:#f5f5f3}
    .os-pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
    .os-pills span{padding:7px 12px;border-radius:999px;background:#161616;border:1px solid rgba(255,255,255,.28);color:#f5f5f3;font-weight:800;font-size:.8rem}
    .os-meta{text-align:left;background:#161616;border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 14px;margin:0 0 16px}
    .os-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:.82rem}
    .os-row + .os-row{border-top:1px solid rgba(255,255,255,.08)}
    .os-k{color:#8f8f8a;font-weight:700}
    .os-v{color:#f5f5f3;font-weight:800;text-align:right;word-break:break-all}
    .os-key{text-align:left;background:#111;border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:14px;margin:0 0 16px}
    .os-key label{display:block;font-size:.65rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#6f6f6c;margin-bottom:8px}
    .os-key code{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92rem;color:#f5f5f3;word-break:break-all;line-height:1.6;user-select:all}
    .os-actions{display:flex;flex-direction:column;gap:10px;margin-top:4px}
    .os-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:12px;font-weight:800;font-size:.92rem;font-family:inherit;text-decoration:none;cursor:pointer;box-sizing:border-box}
    .os-btn-dark{background:#161616;color:#f5f5f3;border:1px solid rgba(255,255,255,.34)}
    .os-btn-light{background:#fff;color:#111;border:1px solid #111}
    html[data-theme="light"] .os-ring{background:#fff;border:2px solid #111}
    html[data-theme="light"] .os-ring:before{border-color:rgba(0,0,0,.12)}
    html[data-theme="light"] .os-ring svg{stroke:#111}
    html[data-theme="light"] .os-badge{background:#fff;color:#111;border:1px solid #111}
    html[data-theme="light"] .os-card h1{color:#111}
    html[data-theme="light"] .os-card p.lead{color:#4a4a48}
    html[data-theme="light"] .os-card p.note{color:#6f6f6c}
    html[data-theme="light"] .os-card p.note strong{color:#111}
    html[data-theme="light"] .os-pills span{background:#fff;color:#111;border:1px solid #111}
    html[data-theme="light"] .os-meta{background:#fff;border:1px solid #d4d4d0}
    html[data-theme="light"] .os-row + .os-row{border-top:1px solid #ecece8}
    html[data-theme="light"] .os-k{color:#6f6f6c}
    html[data-theme="light"] .os-v{color:#111}
    html[data-theme="light"] .os-key{background:#fff;border:1px solid #d4d4d0}
    html[data-theme="light"] .os-key code{color:#111}
    html[data-theme="light"] .os-btn-dark{background:#161616;color:#f5f5f3;border:1px solid rgba(255,255,255,.34)}
    html[data-theme="light"] .os-btn-light{background:#fff;color:#111;border:1px solid #111}
    @keyframes osRing{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.45);opacity:0}}
    @keyframes osCheck{to{stroke-dashoffset:0}}
  </style>
