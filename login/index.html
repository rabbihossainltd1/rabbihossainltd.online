<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="/js/boot-auth.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | RabbiHossainLTD</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://rabbihossainltd.online/login/" />
  <link rel="preload" href="/css/style.min.css" as="style" />
  <link rel="stylesheet" href="/css/style.min.css" />
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    html,body.login-page{width:100%;height:100%;min-height:100dvh;margin:0;overflow:hidden;background:var(--bg,#080808)}
    body.login-page .navbar,body.login-page .rabbi-bottom-nav,body.login-page #rabbiBottomNav,body.login-page .login-brand{display:none!important}
  </style>
</head>
<body class="login-page">
  <script src="/js/auth.js?v=76" defer></script>
  <script>
    (function boot() {
      if (window.rabbiAuth && typeof window.rabbiAuth.openLogin === 'function') {
        window.rabbiAuth.openLogin('login-page');
      } else {
        setTimeout(boot, 80);
      }
    })();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
