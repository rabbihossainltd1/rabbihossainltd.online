<head>

  <title>My Cart — RabbiHossainLTD</title>
  <meta name="description" content="Your cart — review selected services and checkout together." />

  <style>
    .cart-page{min-height:100vh;padding:calc(var(--nav-h) + 8px) 12px 118px;background:var(--bg)}
    .cart-page-inner{max-width:720px;margin:0 auto}
    .cart-page-head{margin-bottom:12px}
    .cart-page-head .kicker{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);font-weight:800}
    .cart-page-head h1{font-size:clamp(1.35rem,4vw,1.85rem);margin:2px 0 0}
    .cart-page-head p{color:var(--text-secondary);font-size:.9rem}
    .cart-card{background:#101010;border:1px solid var(--border);border-radius:16px;padding:12px}
    .cart-item{display:grid;grid-template-columns:18px 52px minmax(0,1fr);grid-template-areas:"check img body" "actions actions actions";align-items:center;column-gap:10px;row-gap:10px;background:#151515;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px;margin-bottom:10px}
    .cart-item-check,.cart-item-check-slot{grid-area:check;width:18px;height:18px;accent-color:#fff;cursor:pointer;margin:0}
    .cart-item img,.cart-item-ph{grid-area:img;width:52px;height:52px;border-radius:10px;object-fit:cover;background:#222}
    .cart-item-body{grid-area:body;min-width:0}
    .cart-item-title{color:#f7f7f4;font-weight:800;font-size:.92rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cart-item-plan{color:#4a4a48;font-size:.78rem;font-weight:700;margin-top:3px;line-height:1.3}
    .cart-item-plan.need{color:#c47a12}
    .cart-item-meta{color:#8b8b87;font-size:.76rem;margin-top:3px;font-weight:650}
    .cart-item-actions{grid-area:actions;display:flex;gap:8px;justify-content:flex-end}
    .cart-remove{flex:none;background:none;border:1px solid rgba(255,255,255,.15);color:#b0b0ad;border-radius:8px;padding:7px 12px;font-size:.74rem;cursor:pointer}
    .cart-remove:hover{color:#fff;border-color:rgba(255,255,255,.4)}
    .cart-choose-plan{flex:none;background:transparent;border:1px solid rgba(255,180,84,.4);color:#ffb454;border-radius:8px;padding:7px 12px;font-size:.74rem;font-weight:700;cursor:pointer;white-space:nowrap}
    .cart-choose-plan:hover{background:rgba(255,180,84,.1)}
    @media(min-width:560px){
      .cart-item{grid-template-columns:18px 52px minmax(0,1fr) auto;grid-template-areas:"check img body actions";align-items:center}
      .cart-item-actions{justify-content:flex-end}
    }
    .cart-empty{text-align:center;padding:40px 20px;color:var(--text-secondary)}
    .cart-empty .mark{width:52px;height:52px;margin:0 auto 16px;border-radius:50%;background:#fff;color:#080808;display:grid;place-items:center}
    .cart-empty a{color:#fff;text-decoration:underline}
    .cart-footer{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
    .cart-selectall{display:flex;align-items:center;gap:8px;color:#b0b0ad;font-size:.84rem;font-weight:700;cursor:pointer;margin-bottom:12px}
    .cart-selectall input{width:16px;height:16px;accent-color:#fff}
    .cart-total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .cart-total-row .lbl{color:#b0b0ad;font-size:.84rem}
    .cart-total-row .val{color:#f7f7f4;font-weight:900;font-size:1.05rem}
    .cart-checkout-btn{width:100%;min-height:50px;border:none;border-radius:14px;background:#fff;color:#080808;font-weight:800;font-size:.92rem;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
    .cart-checkout-btn:hover{opacity:.92}
    .cart-msg{margin-top:12px;font-size:.8rem;font-weight:700;text-align:center}
    .cart-msg.error{color:#ffb0b0}
    /* inline plan picker modal */
    .rh-plan-modal{position:fixed;inset:0;z-index:4000}
    .rh-plan-modal[hidden]{display:none}
    .rh-plan-modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}
    .rh-plan-modal-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 24px));height:min(760px,calc(100vh - 32px));display:flex;flex-direction:column;background:#0e0e0e;border:1px solid rgba(255,255,255,.16);border-radius:20px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.6)}
    .rh-plan-modal-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
    .rh-plan-modal-title{font-weight:800;font-size:.95rem;color:#f7f7f4}
    .rh-plan-modal-close{width:34px;height:34px;flex:none;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#e2e2df;font-size:.9rem;cursor:pointer}
    .rh-plan-modal-close:hover{background:rgba(255,255,255,.08)}
    .rh-plan-modal-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
    .rh-plan-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:1px solid rgba(255,255,255,.14);background:#141414;border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font-family:inherit;transition:border-color .15s,background .15s}
    .rh-plan-opt:hover{border-color:rgba(255,255,255,.4)}
    .rh-plan-opt.sel{border-color:#ffffff;background:rgba(255,255,255,.08)}
    .rh-plan-opt .lbl{font-size:.88rem;font-weight:700;color:#f5f5f3}
    .rh-plan-opt .p{font-size:.9rem;font-weight:800;color:#f5f5f3}
    .rh-plan-opt .p small{display:block;font-size:.68rem;color:#8b8b87;font-weight:600}
    .rh-plan-note{padding:4px 2px;font-size:.78rem;color:#8b8b87;line-height:1.5}
    .cart-checkout-btn:disabled{opacity:.6;cursor:not-allowed}
    .cart-checkout-btn svg{width:17px;height:17px}
    /* checkout summary view */
    .cart-back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid rgba(255,255,255,.15);color:#b0b0ad;border-radius:9px;padding:7px 12px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:16px}
    .cart-back-btn:hover{color:#fff;border-color:rgba(255,255,255,.4)}
    .cart-back-btn svg{width:14px;height:14px}
    .checkout-view-title{font-size:1.15rem;font-weight:800;color:#f7f7f4;margin:0 0 14px}
    .checkout-item{display:flex;align-items:center;gap:12px;background:#151515;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px;margin-bottom:10px}
    .checkout-item img{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none;background:#222}
    .checkout-item .ci-body{flex:1;min-width:0}
    .checkout-item .ci-title{color:#f7f7f4;font-weight:800;font-size:.86rem;line-height:1.3}
    .checkout-item .ci-meta{color:#8b8b87;font-size:.72rem;margin-top:2px}
    .checkout-item .ci-price{color:#f7f7f4;font-weight:800;font-size:.84rem;flex:none}
    .checkout-subtotal-row{display:flex;justify-content:space-between;align-items:center;margin:16px 0 14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}
    .checkout-subtotal-row .lbl{color:#b0b0ad;font-size:.88rem;font-weight:700}
    .checkout-subtotal-row .val{color:#f7f7f4;font-weight:900;font-size:1.2rem}
    .cart-msg{display:none;margin-top:12px;padding:11px 13px;border-radius:12px;font-size:.82rem;line-height:1.5}
    .cart-msg.success{display:block;background:rgba(46,204,113,.1);border:1px solid rgba(46,204,113,.3);color:#8ef0b8}
    .cart-msg.error{display:block;background:rgba(255,80,80,.1);border:1px solid rgba(255,80,80,.3);color:#ffb2b2}
    .cart-msg.info{display:block;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#e0e0df}
    .cart-gate{text-align:center;padding:40px 24px}
    .cart-gate .mark{width:52px;height:52px;margin:0 auto 18px;border-radius:50%;background:#fff;color:#080808;display:grid;place-items:center;font-weight:900;font-size:1.3rem}
    .cart-gate h2{font-size:1.4rem;margin-bottom:8px}
    .cart-gate p{color:var(--text-secondary);margin-bottom:20px}
    .cart-login-btn{width:100%;padding:13px;border:none;border-radius:13px;background:#fff;color:#080808;font-weight:800;font-family:inherit;font-size:.9rem;cursor:pointer}
  </style>

    .rabbi-bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:54px;border-radius:18px;color:#aaaaaa;text-decoration:none;font-size:.68rem;font-weight:800;letter-spacing:.01em;transition:.2s ease;}
    .rabbi-bottom-nav a svg{width:20px;height:20px;stroke-width:1.8;}
