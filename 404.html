  <title>Page Not Found | RabbiHossainLTD</title>

  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090909;color:#f5f5f2}
    body{font-family:"Noto Sans Bengali",system-ui,sans-serif;display:grid;min-height:100vh;grid-template-rows:auto 1fr}
    header{height:72px;border-bottom:1px solid #2b2b2b;display:flex;align-items:center;padding:0 clamp(18px,4vw,56px)}
    header a{color:#fff;text-decoration:none;font-size:.8rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    main{display:grid;grid-template-columns:1fr 1fr;gap:8vw;align-items:end;padding:clamp(48px,8vw,110px) clamp(18px,4vw,56px)}
    .code{font-family:Georgia,serif;font-size:clamp(8rem,26vw,24rem);line-height:.65;font-weight:400;letter-spacing:-.08em;color:#fff}
    .copy{max-width:560px;border-top:1px solid #555;padding-top:26px}
    h1{font-family:Georgia,"Noto Serif Bengali",serif;font-size:clamp(2.4rem,6vw,5.5rem);line-height:1;margin:0 0 24px;font-weight:400}
    p{color:#aaa;line-height:1.8;margin:0 0 30px}
    .actions{display:flex;gap:12px;flex-wrap:wrap}.actions a{min-height:44px;display:inline-flex;align-items:center;padding:0 18px;border:1px solid #fff;color:#fff;text-decoration:none;font-weight:800}
    .actions a:first-child{background:#fff;color:#000}
    html[data-theme="light"],html[data-theme="light"] body{background:#f5f5f2;color:#161616}
    html[data-theme="light"] header{border-bottom-color:#ddd}
    html[data-theme="light"] header a,html[data-theme="light"] .code,html[data-theme="light"] h1{color:#161616}
    html[data-theme="light"] p{color:#4a4a48}
    html[data-theme="light"] .copy{border-top-color:#ccc}
    html[data-theme="light"] .actions a{border-color:#111;color:#111}
    html[data-theme="light"] .actions a:first-child{background:#111;color:#fff;border-color:#111}
    @media(max-width:720px){main{grid-template-columns:1fr;align-items:center}.code{font-size:9rem}.copy{align-self:start}}
  </style>
</head>
<body>
  <header><a href="/">RabbiHossainLTD</a></header>
  <main id="main-content">
    <div class="code" aria-hidden="true">404</div>
